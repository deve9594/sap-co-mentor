<div *ngIf="lesson" class="lesson-wrap">
  <h2 class="lesson-topic">{{ lesson.topic }}</h2>
  <div class="cards">
    <article class="card">
      <h3>📖 Simple Explanation</h3>
      <p>{{ lesson.simpleExplanation }}</p>
    </article>

    <article class="card">
      <h3>🔗 FI Connection</h3>
      <p>{{ lesson.fiConnection }}</p>
    </article>

    <article class="card">
      <h3>🌍 Real World Example</h3>
      <p>{{ lesson.realWorldExample }}</p>
    </article>

    <article class="card">
      <h3>💼 SAP Example</h3>
      <p>{{ lesson.sapExample }}</p>
    </article>

    <article class="card">
      <h3>💡 Why It Matters</h3>
      <p>{{ lesson.whyItMatters }}</p>
    </article>

    <article class="card quiz">
      <h3>🧠 Quiz</h3>
      <p>{{ lesson.quizQuestion }}</p>
    </article>
  </div>
</div>
